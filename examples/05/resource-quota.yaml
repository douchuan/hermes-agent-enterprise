# ResourceQuota —— 限制单个员工 Namespace 的总资源消耗
#
# 部署方式：
#   kubectl apply -f resource-quota.yaml -n hermes-agent-alice

apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-quota
  namespace: hermes-agent-alice
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "1"
    persistentvolumeclaims: "1"
