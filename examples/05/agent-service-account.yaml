# ServiceAccount —— 每员工 Namespace 中的最小权限身份
#
# 部署方式：
#   kubectl apply -f agent-service-account.yaml -n hermes-agent-alice
#
# 默认配置：automountServiceAccountToken: false
# Agent Sandbox 不需要访问 Kubernetes API。

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: hermes-agent-alice
  labels:
    app: hermes-agent
    employee: alice
automountServiceAccountToken: false
