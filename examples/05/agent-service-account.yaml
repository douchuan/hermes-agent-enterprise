# ServiceAccount 和可选的最小权限 RoleBinding
#
# 默认配置：automountServiceAccountToken: false
# Agent Sandbox 不需要访问 Kubernetes API。
#
# 如果确实需要（例如 Agent 查询自身 Pod 状态），
# 使用注释掉的 Role 和 RoleBinding，并确保 resourceNames
# 限定到具体资源名称。

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-alice
  namespace: hermes-agents
automountServiceAccountToken: false

---
# 以下为可选配置，仅在 Agent 需要访问 K8s API 时启用。
# 注意：这是一个高级场景，大多数企业 Agent 部署不需要。
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: agent-self-read
#   namespace: hermes-agents
# rules:
#   - apiGroups: [""]
#     resources: ["pods"]
#     verbs: ["get"]
#     resourceNames: ["agent-alice"]  # 只能读取自己的 Pod
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: agent-alice-self-read
#   namespace: hermes-agents
# subjects:
#   - kind: ServiceAccount
#     name: agent-alice
# roleRef:
#   kind: Role
#   name: agent-self-read
#   apiGroup: rbac.authorization.k8s.io
