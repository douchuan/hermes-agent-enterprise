# 每员工 Namespace 中的加密 PersistentVolume 配置
#
# 部署方式：
#   kubectl apply -f pvc.yaml -n hermes-agent-alice
#
# 或者与应用一起部署：
#   kubectl apply -f agent-sandbox.yaml  (Namespace + Pod)
#   kubectl apply -f pvc.yaml -n hermes-agent-alice

---
# 加密 StorageClass（以 AWS EBS 为例）
# 实际生产中使用云提供商或本地 CSI 驱动
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: encrypted-ssd
provisioner: ebs.csi.aws.com  # 替换为实际 CSI
parameters:
  encrypted: "true"
  kmsKeyId: "alias/hermes-agent-key"  # 使用独立的 KMS key
  fsType: ext4
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
# 每个员工 Namespace 中只有一个 PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: hermes-agent-alice
  labels:
    app: hermes-agent
    employee: alice
spec:
  accessModes:
    - ReadWriteOnce  # 只能被一个 Pod 挂载
  storageClassName: encrypted-ssd
  resources:
    requests:
      storage: 20Gi
