# 完整的 Agent Sandbox 配置
# 对应第 5 章：One Person, One Namespace, One Pod, One Encrypted Volume
#
# 部署方式：
#   kubectl apply -f agent-sandbox.yaml
#
# 这会创建：
#   1. Namespace: hermes-agent-alice
#   2. Pod: agent (在该 Namespace 中)
#
# 部署前需替换：
#   - 镜像地址
#   - employee 和 tenant 标签值
#   - StorageClass 名称（使用加密的 StorageClass）

apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent-alice
  labels:
    app: hermes-agent
    employee: alice
    tenant: acme-corp
---
apiVersion: v1
kind: Pod
metadata:
  name: agent
  namespace: hermes-agent-alice
  labels:
    app: hermes-agent
    employee: alice
    tenant: acme-corp
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  automountServiceAccountToken: false

  containers:
    - name: hermes-agent
      image: ghcr.io/example-org/hermes-agent:v1.2.3
      imagePullPolicy: Always
      workingDir: /home/hermes/workspace

      command: ["/usr/bin/hermes-agent"]
      args:
        - "--config=/etc/hermes/config.yaml"
        - "--workspace=/home/hermes/workspace"
        - "--memory=/home/hermes/memory"

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

      ports:
        - name: api
          containerPort: 8080
          protocol: TCP

      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3

      volumeMounts:
        - name: data
          mountPath: /home/hermes
        - name: config
          mountPath: /etc/hermes
          readOnly: true
        - name: tmp
          mountPath: /tmp

      env:
        - name: HERMES_EMPLOYEE_ID
          value: "alice"
        - name: HERMES_TENANT_ID
          value: "acme-corp"

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: agent-data
    - name: config
      configMap:
        name: agent-config
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
